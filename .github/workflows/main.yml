name: Update News

on:
  schedule:
    - cron: '0 */4 * * *'   # Every 4 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

env:
  DATA_BRANCH: data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Load the previous data (used as cache)
        run: |
          mkdir -p data
          if git fetch --depth=1 origin "$DATA_BRANCH" 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C data
          else
            echo "No '$DATA_BRANCH' branch yet - first run starts with an empty cache."
          fi

      - name: Run generator
        run: python generator.py --out data

      - name: Publish to the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          git init -q -b "$DATA_BRANCH"
          git config user.name  'SpeculaBot'
          git config user.email 'bot@specula.ai'
          git add -A
          git commit -q -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$DATA_BRANCH"

      - name: Refresh the jsDelivr mirror (fallback CDN)
        continue-on-error: true
        run: |
          for f in news.json meta.json; do
            curl -fsS -m 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${DATA_BRANCH}/$f" > /dev/null || true
          done
