<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found — SPECULA</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,800..900&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #120e0b; --text: #f4ece2; --text-2: #b9a998; --accent: #f6a93b; --ink: #1e1206; --line: rgba(255,200,150,.15); }
        @media (prefers-color-scheme: light) { :root { --bg: #f6f0e7; --text: #22180f; --text-2: #5f4f41; --accent: #bd6610; --ink: #fff; --line: rgba(70,45,20,.17); } }
        * { box-sizing: border-box; margin: 0; }
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Manrope, system-ui, sans-serif; color: var(--text);
               background: radial-gradient(900px 420px at 50% -120px, rgba(246,169,59,.09), transparent 70%), var(--bg); text-align: center; }
        img { width: 72px; height: 72px; margin: 0 auto 22px; display: block; }
        .code { font: 800 .8rem Manrope, sans-serif; letter-spacing: .2em; color: var(--accent); margin-bottom: 10px; }
        h1 { font: italic 900 clamp(2rem, 5vw, 2.9rem)/1.08 Fraunces, Georgia, serif; letter-spacing: -.02em; margin-bottom: 12px; }
        p { color: var(--text-2); max-width: 40ch; margin: 0 auto 26px; line-height: 1.6; }
        a { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 12px; background: var(--accent); color: var(--ink); font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <img src="/favicon.svg" alt="">
        <div class="code">404</div>
        <h1>This page isn't on the radar</h1>
        <p>The link may be old or mistyped. The latest stories are one click away.</p>
        <a href="/">Back to SPECULA</a>
    </main>
</body>
</html>
